name: Add a paper
description: Suggest a paper that is missing from the list
title: "[Add paper] "
labels: ["new paper"]
body:
  - type: input
    id: title
    attributes:
      label: Title
    validations:
      required: true
  - type: input
    id: venue
    attributes:
      label: Venue and year (write arXiv if not yet published)
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: arXiv, DOI or proceedings link
    validations:
      required: true
  - type: dropdown
    id: section
    attributes:
      label: Section
      options:
        - Methods
        - Channel (text, layout, tables, charts, equations, forms, stamps, typography)
        - Encoding, indexing and efficiency
        - Attribution and compression
        - OCR and robustness
        - Datasets and benchmarks
        - Metrics and evaluation
    validations:
      required: true
  - type: textarea
    id: channels
    attributes:
      label: Which channels does the paper report results on?
