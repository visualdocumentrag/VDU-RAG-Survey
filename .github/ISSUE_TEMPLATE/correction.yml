name: Correct an entry
description: Report a wrong venue, year, link or value
title: "[Correction] "
labels: ["correction"]
body:
  - type: input
    id: entry
    attributes:
      label: Entry
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong, and the source that shows the correct value
    validations:
      required: true
